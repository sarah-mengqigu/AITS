  version: 2.0.0
  description: AITS v2 - AI-empowered Intelligent Testing System
paths:
  /api/ai/agents/:
    get:
      operationId: ai_agents_retrieve
      tags:
      - ai
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ai/agents/{id}/run/:
    post:
      operationId: ai_agents_run_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ai/llm-configs/:
    get:
      operationId: ai_llm_configs_list
      description: Shared queryset scoping + write permissions for config resources.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: is_default
        schema:
          type: boolean
      - in: query
        name: model_type
        schema:
          type: string
          title: 模型类型
          enum:
          - text
          - vision
        description: |-
          * `text` - 文本
          * `vision` - 视觉
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: integer
      - in: query
        name: provider
        schema:
          type: string
          title: 提供商
          enum:
          - azure
          - deepseek
          - huggingface
          - mock
          - openai
          - qwen
        description: |-
          * `openai` - OpenAI
          * `deepseek` - DeepSeek
          * `qwen` - 通义千问
          * `huggingface` - HuggingFace
          * `azure` - Azure OpenAI
          * `mock` - Mock（离线确定性）
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - ai
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLLMConfigurationList'
          description: ''
    post:
      operationId: ai_llm_configs_create
      description: Shared queryset scoping + write permissions for config resources.
      tags:
      - ai
